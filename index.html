<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111318"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="styles.css"><title>Bar Carnaval</title></head><body><div class="app"><header><img src="logo.png"><div><b>BAR CARNAVAL</b><small>Guégueleville</small></div><button id="undo">↶</button><button id="settings">⚙</button></header><nav id="tabs"></nav><main id="grid"></main><section class="returns"><b>↩ RETOURS CONSIGNES</b><button data-ret="glass">Verre <strong>−2.–</strong></button><button data-ret="pitcher">Pichet <strong>−10.–</strong></button><button data-ret="tray">Plateau <strong>−10.–</strong></button></section><footer><button id="cart"><span id="count">0 article</span><small>Voir la commande</small></button><div><small>À ENCAISSER</small><strong id="total">0.–</strong></div><button id="pay">PAYER</button></footer></div>
<dialog id="softDlg"><div class="sheet"><h2>Quel soft ?</h2><div id="softs" class="softs"></div><button onclick="softDlg.close()">Annuler</button></div></dialog>
<dialog id="cartDlg"><div class="sheet"><h2>Commande / préparation</h2><div id="lines"></div><div class="bigTotal"><span>Total</span><b id="cartTotal"></b></div><button onclick="cartDlg.close()">Retour</button></div></dialog>
<dialog id="payDlg"><div class="sheet"><h2>Paiement</h2><div class="payTotal" id="payTotal"></div><div class="paytypes"><button id="cash">💵 Cash</button><button id="twint">📱 TWINT</button></div><div id="cashBox" hidden><label>Le client donne</label><input id="given" inputmode="decimal" placeholder="50"><div id="change"></div><button id="confirmCash">Valider cash</button></div><button id="confirmTwint" hidden>Valider TWINT</button></div></dialog>
<dialog id="pinDlg"><div class="sheet"><h2>Code comité</h2><input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="PIN"><button id="pinOk">Ouvrir les réglages</button><small>PIN initial : 2026</small></div></dialog>
<dialog id="settingsDlg"><div class="sheet"><h2>Réglages & statistiques</h2><div id="stats"></div><label>Nouveau PIN comité</label><input id="newPin" inputmode="numeric"><button id="savePin">Enregistrer le PIN</button><p>Les prix et produits seront modifiables dans la prochaine itération. Les données restent sur cet appareil.</p><button onclick="settingsDlg.close()">Fermer</button></div></dialog>
