<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#111315" />
  <title>Carnaval Bar</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <img src="logo.png" alt="Carnaval" class="logo"/>
        <div>
          <div class="title">BAR CARNAVAL</div>
          <div class="subtitle">Guégueleville</div>
        </div>
      </div>
      <div class="top-actions">
        <button id="historyBtn" class="icon-btn">🕘</button>
        <button id="updateBtn" class="update-btn hidden">METTRE À JOUR</button>
      </div>
    </header>

    <div id="versionLabel" class="version">V3.3</div>

    <nav id="tabs" class="tabs"></nav>
    <main>
      <section id="products" class="product-grid"></section>

      <section class="returns">
        <div class="section-title">RETOURS CONSIGNES</div>
        <div class="return-grid">
          <button class="return-btn return-glass" data-return="glass">
            <span class="return-name">VERRE</span>
            <span class="return-price">−2 CHF</span>
            <span class="qty-badge" id="retGlassQty"></span>
          </button>
          <button class="return-btn return-big" data-return="big">
            <span class="return-name">PLATEAU • ARROSOIR • PICHET</span>
            <span class="return-price">−10 CHF</span>
            <span class="qty-badge" id="retBigQty"></span>
          </button>
        </div>
      </section>
    </main>

    <footer class="checkout">
      <button id="undoBtn" class="undo-btn" title="Annuler la dernière action">↩︎</button>
      <button id="orderBtn" class="order-summary">
        <span id="articleCount">0 article</span>
        <strong>COMMANDE</strong>
      </button>
      <div class="total-box">
        <span>À ENCAISSER</span>
        <strong id="totalDue">0 CHF</strong>
      </div>
      <button id="payBtn" class="pay-btn">PAYER</button>
    </footer>
  </div>

  <div id="modalBackdrop" class="backdrop hidden"></div>

  <div id="orderModal" class="modal hidden">
    <div class="modal-head">
      <div>
        <div class="eyebrow">PRÉPARATION</div>
        <h2>COMMANDE À PRÉPARER</h2>
      </div>
      <button class="close-btn" data-close="orderModal">✕</button>
    </div>
    <div id="orderLines" class="order-lines"></div>
    <div id="returnLines" class="return-lines"></div>
  </div>

  <div id="mixerModal" class="modal hidden">
    <div class="modal-head">
      <div>
        <div class="eyebrow">ACCOMPAGNEMENT</div>
        <h2 id="mixerTitle">Choisir le soft</h2>
      </div>
      <button class="close-btn" data-close="mixerModal">✕</button>
    </div>
    <div id="mixerGrid" class="mixer-grid"></div>
  </div>

  <div id="payModal" class="modal hidden">
    <div class="modal-head">
      <div>
        <div class="eyebrow">PAIEMENT</div>
        <h2 id="payAmount">0 CHF</h2>
      </div>
      <button class="close-btn" data-close="payModal">✕</button>
    </div>
    <div class="pay-tabs">
      <button id="cashTab" class="pay-tab active">CASH</button>
      <button id="twintTab" class="pay-tab">TWINT</button>
    </div>

    <div id="cashPanel">
      <label class="field-label">Le client donne</label>
      <input id="cashInput" inputmode="decimal" class="cash-input" placeholder="0 CHF" />
      <div class="quick-cash">
        <button data-cash="20">20 CHF</button>
        <button data-cash="50">50 CHF</button>
        <button data-cash="100">100 CHF</button>
      </div>
      <div class="change-box">
        <span>À RENDRE</span>
        <strong id="changeDue">0 CHF</strong>
      </div>
      <button id="validateCash" class="validate-btn">VALIDER CASH</button>
    </div>

    <div id="twintPanel" class="hidden">
      <div class="twint-placeholder">
        <div class="twint-symbol">TWINT</div>
        <div class="twint-note">QR du carnaval à ajouter plus tard</div>
      </div>
      <button id="validateTwint" class="validate-btn twint-btn">VALIDER TWINT</button>
    </div>
  </div>

  <div id="historyModal" class="modal hidden">
    <div class="modal-head">
      <div>
        <div class="eyebrow">DERNIÈRES COMMANDES</div>
        <h2>Historique</h2>
      </div>
      <button class="close-btn" data-close="historyModal">✕</button>
    </div>
    <div id="historyList" class="history-list"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
